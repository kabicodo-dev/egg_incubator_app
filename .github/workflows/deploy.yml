name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Quality gate - flutter analyze
        run: flutter analyze

      - name: Quality gate - flutter test
        run: flutter test

      - name: Create environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=0
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Missing required configuration: SUPABASE_URL"
            status=1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing required configuration: SUPABASE_ANON_KEY"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Validate environment file
        run: |
          test -s .env
          grep -q '^SUPABASE_URL=' .env
          grep -q '^SUPABASE_ANON_KEY=' .env

      - name: Build Flutter web
        run: flutter build web --release --base-href /egg_incubator_app/ --dart-define-from-file=.env

      - name: Setup Pages
        if: ${{ success() }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ success() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        if: ${{ success() }}
        id: deployment
        uses: actions/deploy-pages@v4
