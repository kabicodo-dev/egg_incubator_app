name: CI

on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter analyze
        # Archived review scripts under docs/ are not application dependencies.
        # Keep every production Dart file and Flutter test in the quality gate.
        run: flutter analyze --no-pub lib test

      - name: Flutter test
        run: flutter test --no-pub
